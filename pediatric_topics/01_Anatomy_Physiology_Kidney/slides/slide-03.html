<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform=`scale(${sc})`;s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script></head><body><div class="slide-content" style="background:#ffffff;"><svg width="220" height="16" viewBox="0 0 220 16" aria-hidden="true" style="position:absolute; top:0; right:0;"><rect x="0" y="0" width="140" height="16" fill="#83c5be"/><rect x="150" y="0" width="70" height="16" fill="#e29578"/></svg><div style="padding:90px 70px 70px; height:100%; box-sizing:border-box;"><div style="font-size:88px; font-weight:bold; color:#e29578; line-height:1;">01</div><div style="font-size:42px; font-weight:bold; color:#006d77; margin-top:10px; line-height:1.15;">Functions of the Kidneys</div><div style="width:110px; height:5px; background:#83c5be; margin-top:16px;"></div><div style="font-family:"Times New Roman", serif; font-size:16px; color:#1c3f42; margin-top:18px; max-width:560px; line-height:1.6;">The kidneys are both regulatory and excretory organs, performing five major functions essential for homeostasis.</div></div><svg width="54" height="32" viewBox="0 0 54 32" style="position:absolute; right:32px; bottom:22px;" aria-hidden="true"><rect x="0" y="0" width="54" height="32" rx="7" fill="#006d77"/><text x="27" y="22" font-family=""Times New Roman", serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">03</text></svg></div></body></html>
