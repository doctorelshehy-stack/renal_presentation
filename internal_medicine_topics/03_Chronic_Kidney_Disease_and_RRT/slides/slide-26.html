<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){var s=document.querySelector('.slide-content');if(!s)return;var sx=window.innerWidth/960;var sy=window.innerHeight/540;var sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform='scale('+sc+')';s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="width:960px;height:540px;background:#F1E8D9;font-family:'Times New Roman',serif;color:#3A2B22;overflow:hidden;">

<div style="position:absolute;top:26px;left:60px;right:60px;z-index:5;"><p style="font-size:30px;font-weight:700;color:#4B3223;margin:0;line-height:1.1;">Control of Symptoms &mdash; Cardiovascular</p><div style="width:64px;height:4px;background:#B97A2E;margin:8px 0 0 0;border-radius:2px;"></div></div>
<div style="position:absolute;top:96px;left:60px;right:60px;z-index:5;">
  <div style="background:#FBF4E7;border-radius:10px;padding:14px 16px;border-left:4px solid #A84A2A;box-shadow:0 2px 8px rgba(62,40,25,0.10);"><ul style="margin:0;padding:0 0 0 20px;font-size:15px;color:#3A2B22;line-height:1.45;"><li style="margin:0 0 8px 0;"><b>1.</b> Control of hypertension; ACEI/ARBs, CCB, BB.</li><li style="margin:0 0 8px 0;"><b>2.</b> ACEI or ARBs are preferred if there is proteinuria, but with careful monitoring of serum creatinine and potassium levels.</li><li style="margin:0 0 8px 0;"><b>3.</b> Volume overload &#8594; loop diuretics.</li><li style="margin:0 0 8px 0;"><b>4.</b> Pericarditis &#8594; dialysis.</li></ul></div>
</div>

<svg style="position:absolute;right:30px;bottom:20px;width:40px;height:32px;z-index:100;" aria-hidden="true"><rect x="0" y="0" width="40" height="32" rx="6" fill="#B97A2E"/><text x="20" y="23" font-family="Times New Roman,serif" font-size="15" font-weight="700" fill="#FFFDF6" text-anchor="middle">26</text></svg>
</div>
</body>
</html>
