<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){var s=document.querySelector('.slide-content');if(!s)return;var sx=window.innerWidth/960;var sy=window.innerHeight/540;var sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform='scale('+sc+')';s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="width:960px;height:540px;background:#F1E8D9;font-family:'Times New Roman',serif;color:#3A2B22;overflow:hidden;">

<div style="position:absolute;top:0;left:0;width:960px;height:540px;background:#F1E8D9;"></div>
<div style="position:absolute;top:26px;left:60px;right:60px;z-index:5;">
  <p style="font-size:32px;font-weight:700;color:#4B3223;margin:0;">Table of Contents</p>
  <div style="width:64px;height:4px;background:#B97A2E;margin:8px 0 22px 0;border-radius:2px;"></div>
</div>
<div style="position:absolute;top:92px;left:60px;right:60px;z-index:5;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;">
    <div style="display:flex;align-items:center;gap:14px;background:#FBF4E7;border-radius:8px;padding:11px 14px;border-left:4px solid #B97A2E;box-shadow:0 2px 6px rgba(62,40,25,0.08);">
      <span style="font-size:19px;font-weight:700;color:#B97A2E;min-width:30px;">01</span>
      <span style="font-size:17px;color:#3A2B22;">Chronic Kidney Disease &mdash; Definitions &amp; Markers</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;background:#FBF4E7;border-radius:8px;padding:11px 14px;border-left:4px solid #A84A2A;box-shadow:0 2px 6px rgba(62,40,25,0.08);">
      <span style="font-size:19px;font-weight:700;color:#A84A2A;min-width:30px;">02</span>
      <span style="font-size:17px;color:#3A2B22;">CKD &mdash; Grades, Causes &amp; Clinical Features</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;background:#FBF4E7;border-radius:8px;padding:11px 14px;border-left:4px solid #6E7A48;box-shadow:0 2px 6px rgba(62,40,25,0.08);">
      <span style="font-size:19px;font-weight:700;color:#6E7A48;min-width:30px;">03</span>
      <span style="font-size:17px;color:#3A2B22;">CKD &mdash; Bone Disease, Investigations</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;background:#FBF4E7;border-radius:8px;padding:11px 14px;border-left:4px solid #D9A45B;box-shadow:0 2px 6px rgba(62,40,25,0.08);">
      <span style="font-size:19px;font-weight:700;color:#D9A45B;min-width:30px;">04</span>
      <span style="font-size:17px;color:#3A2B22;">CKD &mdash; Treatment (Conservative)</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;background:#FBF4E7;border-radius:8px;padding:11px 14px;border-left:4px solid #B97A2E;box-shadow:0 2px 6px rgba(62,40,25,0.08);">
      <span style="font-size:19px;font-weight:700;color:#B97A2E;min-width:30px;">05</span>
      <span style="font-size:17px;color:#3A2B22;">RRT &mdash; Dialysis &amp; Peritoneal Dialysis</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;background:#FBF4E7;border-radius:8px;padding:11px 14px;border-left:4px solid #B97A2E;box-shadow:0 2px 6px rgba(62,40,25,0.08);">
      <span style="font-size:19px;font-weight:700;color:#B97A2E;min-width:30px;">06</span>
      <span style="font-size:17px;color:#3A2B22;">RRT &mdash; Hemodialysis &amp; Kidney Transplantation</span>
    </div>
  </div>
</div>

<svg style="position:absolute;right:30px;bottom:20px;width:40px;height:32px;z-index:100;" aria-hidden="true"><rect x="0" y="0" width="40" height="32" rx="6" fill="#B97A2E"/><text x="20" y="23" font-family="Times New Roman,serif" font-size="15" font-weight="700" fill="#FFFDF6" text-anchor="middle">2</text></svg>
</div>
</body>
</html>
