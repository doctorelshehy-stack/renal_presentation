<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform='scale('+sc+')';s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="width:960px;height:540px;background:#EDDCC2;font-family:'Times New Roman',serif;overflow:hidden;">
<div style="position:absolute;top:20px;left:50px;right:50px;z-index:10;">
  <div style="display:flex;align-items:baseline;gap:12px;">
    <span style="font-size:24px;font-weight:700;color:#B07C44;">1</span>
    <p style="font-size:30px;font-weight:700;color:#5B3A21;margin:0;line-height:1.1;">CIN &mdash; Prognosis</p>
  </div>
  <div style="width:70px;height:4px;background:#B07C44;margin:7px 0 0 0;"></div>
</div><div style="position:absolute;top:88px;left:50px;right:50px;bottom:46px;z-index:10;">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
  <div style="background:#FBF3E3;border-radius:10px;padding:12px 16px;border-left:5px solid #6E7F4A;box-shadow:0 1px 3px rgba(91,58,33,0.18);"><p style="font-size:17px;font-weight:700;color:#5B3A21;margin:0 0 6px 0;"><b>Most patients</b></p>
    <p style="font-size:15px;color:#3A2A1B;margin:0;line-height:1.5;"><b style="color:#6E7F4A;">Complete recovery</b> of renal function <b style="color:#6E7F4A;">usually occurs</b>.</p>
  </div>
  <div style="background:#FBF3E3;border-radius:10px;padding:12px 16px;border-left:5px solid #9E3B2C;box-shadow:0 1px 3px rgba(91,58,33,0.18);"><p style="font-size:17px;font-weight:700;color:#5B3A21;margin:0 0 6px 0;"><b>Small minority</b></p>
    <p style="font-size:15px;color:#3A2A1B;margin:0;line-height:1.5;">A small minority of patients may go on to <b style="color:#9E3B2C;">CKD</b>.</p>
  </div>
</div>
<div style="height:14px;"></div>
<div style="background:#EFE7D2;border-radius:8px;padding:8px 14px;border-left:5px solid #D9A23B;">
  <p style="font-size:14px;color:#3A2A1B;margin:0;line-height:1.45;"><b style="color:#B07C44;">NB:</b> CIN is <b>largely reversible</b> &mdash; the creatinine curve typically returns to baseline within 7&ndash;10 days.</p>
</div>
</div>

</div>
</body>
</html>
