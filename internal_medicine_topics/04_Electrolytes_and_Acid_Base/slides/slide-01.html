<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform='scale('+sc+')';s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="width:960px;height:540px;background:#5B3A21;font-family:'Times New Roman',serif;overflow:hidden;">

<div style="position:absolute;top:0;left:0;width:960px;height:540px;background:#5B3A21;"></div>
<div style="position:absolute;top:0;left:0;width:26px;height:540px;background:#B07C44;"></div>
<div style="position:absolute;bottom:0;left:0;width:960px;height:90px;background:#7A5636;"></div>
<svg style="position:absolute;top:-70px;right:-90px;width:520px;height:420px;z-index:1;" aria-hidden="true">
  <ellipse cx="260" cy="210" rx="210" ry="300" fill="#B07C44" opacity="0.25"/>
</svg>
<svg style="position:absolute;bottom:0;left:300px;width:520px;height:260px;z-index:1;" aria-hidden="true">
  <ellipse cx="260" cy="130" rx="240" ry="150" fill="#7A5636" opacity="0.35"/>
</svg>
<div style="position:absolute;top:100px;left:80px;z-index:10;">
  <div style="width:90px;height:5px;background:#D9A23B;margin-bottom:16px;"></div>
  <p style="font-size:22px;color:#D9A23B;margin:0;font-weight:400;letter-spacing:3px;">INTERNAL MEDICINE &middot; NEPHROLOGY</p>
  <p style="font-size:52px;color:#FBF3E3;margin:10px 0 0 0;font-weight:700;line-height:1.08;">Electrolytes &amp; Acid-Base<br>Disturbances</p>
  <div style="width:70px;height:4px;background:#D9A23B;margin:20px 0 16px 0;"></div>
  <p style="font-size:22px;color:#FBF3E3;margin:0;font-weight:400;">Chapters 14 &ndash; 18 &mdash; Principles of Nephrology</p>
</div>
<div style="position:absolute;bottom:28px;left:80px;z-index:10;">
  <p style="font-size:17px;color:#FBF3E3;margin:0;opacity:0.95;">Dr. Hassan Abd-Elhady &mdash; Menoufia University</p>
  <p style="font-size:14px;color:#FBF3E3;margin:3px 0 0 0;opacity:0.7;">Acid-Base Balance &middot; Hyponatremia &middot; Hypernatremia &middot; Hyperkalemia &middot; Hypokalemia</p>
</div>


</div>
</body>
</html>
