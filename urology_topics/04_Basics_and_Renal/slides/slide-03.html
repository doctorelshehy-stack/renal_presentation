<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide(){const s=document.querySelector('.slide-content');if(!s)return;const sx=window.innerWidth/960;const sy=window.innerHeight/540;const sc=Math.min(sx,sy);s.style.width='960px';s.style.height='540px';s.style.transform=`scale(${sc})`;s.style.transformOrigin='center center';s.style.flexShrink='0';}
window.addEventListener('load',scaleSlide);window.addEventListener('resize',scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="display:flex; flex-direction:column; background:#006d77; box-sizing:border-box; font-family:'Times New Roman', serif; overflow:hidden;">
<svg aria-hidden="true" style="position:absolute; top:-70px; right:-40px; width:420px; height:420px;" xmlns="http://www.w3.org/2000/svg"><circle cx="210" cy="210" r="190" fill="none" stroke="#83c5be" stroke-width="2" opacity="0.35"/><circle cx="210" cy="210" r="130" fill="none" stroke="#83c5be" stroke-width="2" opacity="0.25"/></svg><div style="position:absolute; left:70px; top:64px; width:86px; height:6px; background:#e29578;"></div><div style="position:absolute; left:70px; top:92px; font-size:110px; font-weight:700; color:#e29578; font-family:'Times New Roman', serif; line-height:1;">01</div><div style="position:absolute; left:70px; top:224px; font-size:46px; font-weight:700; color:#edf6f9; font-family:'Times New Roman', serif; line-height:1.12;">Anatomy of the Urinary Tract</div><div style="position:absolute; left:70px; top:306px; width:560px; font-size:17px; color:#83c5be; line-height:1.5; font-family:'Times New Roman', serif;">From the embryological development of the kidney to the surgical anatomy of the scrotum — structure, relations, blood supply and innervation that underpin every urological procedure.</div><div style="position:absolute; left:70px; bottom:64px; font-size:14px; letter-spacing:3px; color:rgba(255,221,210,0.75); font-family:'Times New Roman', serif;">BASICS & RENAL &nbsp;·&nbsp; SECTION 01</div>
<svg aria-hidden="true" style="position:absolute; right:32px; bottom:22px; width:46px; height:30px;" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="44" height="28" rx="14" fill="#edf6f9" stroke="#83c5be" stroke-width="1.5"/><text x="23" y="21" text-anchor="middle" font-family="'Times New Roman', serif" font-size="15" font-weight="700" fill="#006d77">3</text></svg>
</div>
</body>
</html>
