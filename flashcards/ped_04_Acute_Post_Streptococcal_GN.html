<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acute Post-Streptococcal GN (APSGN) — Flashcards</title>
<style>
:root {
  --accent: #2E7D8C; --dark: #14404A; --mid: #1F5F6E; --bg: #E4F0F2; --card: #F4FAFB; --warn: #B0542E; --badge: #BFDCE3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Times New Roman', Georgia, serif; background: var(--bg); color: var(--dark);
  display: flex; flex-direction: column; min-height: 100vh;
}
header {
  background: linear-gradient(135deg, var(--dark), var(--mid) 60%, var(--accent));
  color: #fff; padding: 14px 24px 12px; flex-shrink: 0;
}
header .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 21px; letter-spacing: 1px; }
header .course { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; opacity: .85; }
header .meta { font-size: 13px; opacity: .9; }
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 24px; background: var(--card); border-bottom: 2px solid var(--accent); flex-shrink: 0;
}
.toolbar button, .chips button {
  font-family: inherit; font-size: 13.5px; cursor: pointer; border-radius: 20px; padding: 5px 14px;
  border: 1.5px solid var(--mid); background: #fff; color: var(--dark); transition: all .15s;
}
.toolbar button:hover, .chips button:hover { background: var(--badge); }
.toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button.active { background: var(--dark); color: #fff; border-color: var(--dark); }
.progress-wrap { height: 6px; background: #ddd; }
#progressbar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--warn)); transition: width .25s; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 22px; }
#cardwrap { perspective: 1400px; width: min(760px, 92vw); height: min(430px, 60vh); cursor: pointer; }
#card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s; }
#card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 16px; padding: 26px 34px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.15);
  border: 1px solid var(--mid);
}
.front { background: var(--card); display: flex; flex-direction: column; }
.back { background: #fff; transform: rotateY(180deg); }
.face .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
.face .cat {
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--accent);
  background: var(--badge); padding: 3px 10px; border-radius: 12px;
}
.face .n { font-size: 12px; color: var(--warn); font-weight: 700; }
.front .label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--warn); font-weight: 700; margin-bottom: 6px; }
.front .qtext { font-size: clamp(17px, 2.4vw, 24px); line-height: 1.45; font-weight: 700; }
.back .label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.back .atext { font-size: clamp(14px, 1.9vw, 18.5px); line-height: 1.5; color: #222; }
.back .atext ul { margin: 8px 0 8px 22px; }
.back .atext li { margin: 4px 0; }
.back .atext b { color: var(--dark); }
.back .atext .hl { background: var(--badge); padding: 0 4px; border-radius: 4px; font-weight: 700; color: var(--dark); }
.hint { margin-top: auto; padding-top: 14px; font-size: 12px; color: #888; text-align: center; }
footer { flex-shrink: 0; padding: 10px 24px; font-size: 12.5px; color: var(--mid); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--card); border-top: 1px solid #ddd; }
footer b { color: var(--dark); }
.kbd { border: 1px solid #bbb; border-radius: 4px; padding: 0 5px; background: #fff; font-family: monospace; font-size: 11px; }
@media (max-width: 640px) {
  header h1 { font-size: 16px; } .face { padding: 18px 20px; } .front .qtext { font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <div class="course">Pediatrics · NEPHRO-UROLOGY STUDY</div>
      <h1>Acute Post-Streptococcal GN (APSGN)</h1>
    </div>
    <div class="meta"><span id="counts">9 cards</span> · <span id="catcount"></span></div>
  </div>
</header>
<div class="toolbar">
  <button id="btnPrev" title="Previous (←)">← Prev</button>
  <button id="btnFlip" title="Flip (Space)">Flip Card</button>
  <button id="btnNext" title="Next (→)">Next →</button>
  <button id="btnShuffle" title="Shuffle deck">Shuffle</button>
  <button id="btnRestart" title="Back to start">Restart</button>
  <span style="flex:1"></span>
  <div class="chips" id="chips"></div>
</div>
<div class="progress-wrap"><div id="progressbar"></div></div>
<main>
  <div id="cardwrap" title="Click to flip">
    <div id="card">
      <div class="face front">
        <div class="badge-row"><span class="cat" id="fcat"></span><span class="n" id="fn"></span></div>
        <div class="label">Question</div>
        <div class="qtext" id="fq"></div>
        <div class="hint">Click card or press Space to flip · ← → to navigate</div>
      </div>
      <div class="face back">
        <div class="badge-row"><span class="cat" id="bcat"></span><span class="n" id="bn"></span></div>
        <div class="label">Answer</div>
        <div class="atext" id="ba"></div>
      </div>
    </div>
  </div>
</main>
<footer>
  <span><b id="cur">1</b> / <b id="tot">9</b></span>
  <span>Source-faithful flashcards · Pediatrics · Acute Post-Streptococcal GN (APSGN)</span>
  <span>Keys: <span class="kbd">←</span> <span class="kbd">→</span> prev/next · <span class="kbd">Space</span> flip · <span class="kbd">S</span> shuffle</span>
</footer>
<script>
const CARDS = [{"q": "Define APSGN and its 4 cardinal features.", "a": "Acute, specific, self-limited glomerulonephritis due to prior streptococcal infection with: 1. sudden onset <b>gross hematuria</b>, 2. mild-to-moderate <b>edema</b>, 3. <b>hypertension</b>, 4. <b>oliguria</b> (may be present).", "cat": "Definition"}, {"q": "Compare throat vs skin streptococcal infection in APSGN.", "a": "<ul><li><b>Throat:</b> strains 4 &amp; 12; winter/spring; latent period <b>1–2 weeks</b>; ASO titre elevated</li><li><b>Skin:</b> strain <b>49</b>; summer; latent period <b>2–3 weeks</b>; ASO may be normal</li></ul>", "cat": "Etiology"}, {"q": "Describe the pathology of APSGN (gross, LM, IF, EM).", "a": "Gross: symmetrically enlarged kidneys. LM: all glomeruli enlarged and bloodless, diffuse mesangial cell proliferation with increased matrix. IF: <b>lumpy-bumpy</b> deposits of immunoglobulin + complement on the GBM and mesangium. EM: electron-dense deposits (<b>humps</b>) on the <b>epithelial side</b> of the GBM.", "cat": "Pathology"}, {"q": "What is the typical age and presentation of APSGN?", "a": "Age <b>5–12 years</b> (uncommon before 3 years). Acute nephritic syndrome 1–2 wk after pharyngitis or 3–6 wk after pyoderma: edema (salt &amp; water retention), hypertension, oliguria; spectrum from asymptomatic microscopic hematuria to AKI; possible encephalopathy/heart failure; non-specific malaise, lethargy, fever, abdominal/flank pain.", "cat": "Clinical"}, {"q": "What are the natural course and complications of APSGN?", "a": "Acute phase resolves within <b>6–8 weeks</b>; proteinuria/HTN normalize by ~6 wk; microscopic hematuria may persist 1–2 years. Complications: <b>hypertension in 60%</b> (hypertensive encephalopathy in 10%), heart failure, hyperkalemia, hyperphosphatemia, hypocalcemia, acidosis, seizures, uremia. <b>Emergencies: hyperkalemia, hypertensive encephalopathy, CHF, RPGN.</b>", "cat": "Clinical"}, {"q": "How is APSGN diagnosed?", "a": "Urine: smoky/cola color, oliguria, high specific gravity, <b>dysmorphic RBCs + RBC casts</b>, nephritic-range proteinuria, leukocytes. <b>Serum C3 reduced in the acute phase, returns to normal 6–8 wk</b>. Evidence of streptococcal infection: rising ASOT (pharyngeal) or <b>anti-DNase B (best for cutaneous infection)</b>; throat culture may just show carrier state.", "cat": "Diagnosis"}, {"q": "When is renal biopsy considered in APSGN?", "a": "AKI with RPGN; nephrotic-range proteinuria; <b>absence of evidence of streptococcal infection</b>; normal complement; or persistence of hematuria/proteinuria/low C3 for &gt;2 months after onset.", "cat": "Diagnosis"}, {"q": "Outline treatment of APSGN.", "a": "<b>General:</b> bed rest only during the oliguric phase; fluid intake = <b>UOP + 400 ml/m²</b>; protein &amp; salt restriction; high-carbohydrate diet. <b>Specific:</b> manage renal insufficiency &amp; hypertension; <b>10-day course of penicillin</b> to eradicate streptococci (does not alter the natural history). Prevention: early antibiotics do NOT eliminate GN risk; culture &amp; treat family contacts.", "cat": "Treatment"}, {"q": "What is the prognosis of APSGN?", "a": "Complete recovery in <b>&gt;95%</b>; mortality in the acute stage avoidable with good management; rarely severe acute phase → glomerular hyalinization and chronic renal insufficiency; <b>recurrences are extremely rare</b>.", "cat": "Prognosis"}];
let order = CARDS.map((_, i) => i);
let pos = 0, filter = 'all';

const cats = [...new Set(CARDS.map(c => c.cat))];
const chipsEl = document.getElementById('chips');
function visibleOrder() { return order.filter(i => filter==='all' || CARDS[i].cat===filter); }
function renderChips() {
  chipsEl.innerHTML = '';
  const mk = (label, f) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = filter===f ? 'active' : '';
    b.onclick = () => { filter=f; pos=0; renderChips(); render(); };
    chipsEl.appendChild(b);
  };
  mk('All (' + visibleOrder().length + ')', 'all');
  cats.forEach(c => mk(c + ' (' + CARDS.filter(x => x.cat===c).length + ')', c));
}
function card() {
  const vis = visibleOrder();
  if (!vis.length) return null;
  return CARDS[vis[pos % vis.length]];
}
function render() {
  const vis = visibleOrder();
  document.getElementById('tot').textContent = vis.length;
  const c = card();
  if (!c) {
    document.getElementById('cur').textContent = 0;
    document.getElementById('fq').textContent = 'No cards in this category';
    document.getElementById('ba').innerHTML = 'Choose another category.';
    document.getElementById('fcat').textContent = '';
    document.getElementById('fn').textContent = '';
    document.getElementById('progressbar').style.width = '0%';
    return;
  }
  document.getElementById('cur').textContent = (pos % vis.length) + 1;
  document.getElementById('fcat').textContent = c.cat;
  document.getElementById('bcat').textContent = c.cat;
  document.getElementById('fn').textContent = 'Card ' + (pos % vis.length + 1);
  document.getElementById('bn').textContent = 'Card ' + (pos % vis.length + 1);
  document.getElementById('fq').textContent = c.q;
  document.getElementById('ba').innerHTML = c.a;
  document.getElementById('progressbar').style.width = ((pos % vis.length + 1) / vis.length * 100) + '%';
  document.getElementById('catcount').textContent = filter==='all' ? 'all categories' : 'category: ' + filter;
  flip = false;
  document.getElementById('card').classList.remove('flipped');
}
function flipCard() {
  flip = !flip;
  document.getElementById('card').classList.toggle('flipped', flip);
}
function next() { const n = visibleOrder().length; if (n) { pos++; render(); } }
function prev() { const n = visibleOrder().length; if (n) { pos = (pos + n - 1) % n; render(); } }
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0; render(); renderChips();
}
document.getElementById('btnNext').onclick = next;
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnFlip').onclick = flipCard;
document.getElementById('btnShuffle').onclick = shuffle;
document.getElementById('btnRestart').onclick = () => { order = CARDS.map((_, i) => i); pos = 0; render(); renderChips(); };
document.getElementById('cardwrap').onclick = flipCard;
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === 's' || e.key === 'S') shuffle();
});
renderChips();
render();
</script>
</body>
</html>
