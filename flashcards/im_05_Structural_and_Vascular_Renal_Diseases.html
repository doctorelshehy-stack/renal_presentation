<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structural &amp; Vascular Renal Diseases — Flashcards</title>
<style>
:root {
  --accent: #B0722F; --dark: #4A2F16; --mid: #7A5233; --bg: #F2E4CE; --card: #FBF3E4; --warn: #A86E1C; --badge: #E8C98A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Times New Roman', Georgia, serif; background: var(--bg); color: var(--dark);
  display: flex; flex-direction: column; min-height: 100vh;
}
header {
  background: linear-gradient(135deg, var(--dark), var(--mid) 60%, var(--accent));
  color: #fff; padding: 14px 24px 12px; flex-shrink: 0;
}
header .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 21px; letter-spacing: 1px; }
header .course { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; opacity: .85; }
header .meta { font-size: 13px; opacity: .9; }
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 24px; background: var(--card); border-bottom: 2px solid var(--accent); flex-shrink: 0;
}
.toolbar button, .chips button {
  font-family: inherit; font-size: 13.5px; cursor: pointer; border-radius: 20px; padding: 5px 14px;
  border: 1.5px solid var(--mid); background: #fff; color: var(--dark); transition: all .15s;
}
.toolbar button:hover, .chips button:hover { background: var(--badge); }
.toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button.active { background: var(--dark); color: #fff; border-color: var(--dark); }
.progress-wrap { height: 6px; background: #ddd; }
#progressbar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--warn)); transition: width .25s; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 22px; }
#cardwrap { perspective: 1400px; width: min(760px, 92vw); height: min(430px, 60vh); cursor: pointer; }
#card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s; }
#card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 16px; padding: 26px 34px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.15);
  border: 1px solid var(--mid);
}
.front { background: var(--card); display: flex; flex-direction: column; }
.back { background: #fff; transform: rotateY(180deg); }
.face .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
.face .cat {
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--accent);
  background: var(--badge); padding: 3px 10px; border-radius: 12px;
}
.face .n { font-size: 12px; color: var(--warn); font-weight: 700; }
.front .label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--warn); font-weight: 700; margin-bottom: 6px; }
.front .qtext { font-size: clamp(17px, 2.4vw, 24px); line-height: 1.45; font-weight: 700; }
.back .label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.back .atext { font-size: clamp(14px, 1.9vw, 18.5px); line-height: 1.5; color: #222; }
.back .atext ul { margin: 8px 0 8px 22px; }
.back .atext li { margin: 4px 0; }
.back .atext b { color: var(--dark); }
.back .atext .hl { background: var(--badge); padding: 0 4px; border-radius: 4px; font-weight: 700; color: var(--dark); }
.hint { margin-top: auto; padding-top: 14px; font-size: 12px; color: #888; text-align: center; }
footer { flex-shrink: 0; padding: 10px 24px; font-size: 12.5px; color: var(--mid); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--card); border-top: 1px solid #ddd; }
footer b { color: var(--dark); }
.kbd { border: 1px solid #bbb; border-radius: 4px; padding: 0 5px; background: #fff; font-family: monospace; font-size: 11px; }
@media (max-width: 640px) {
  header h1 { font-size: 16px; } .face { padding: 18px 20px; } .front .qtext { font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <div class="course">Internal Medicine · NEPHRO-UROLOGY STUDY</div>
      <h1>Structural &amp; Vascular Renal Diseases</h1>
    </div>
    <div class="meta"><span id="counts">17 cards</span> · <span id="catcount"></span></div>
  </div>
</header>
<div class="toolbar">
  <button id="btnPrev" title="Previous (←)">← Prev</button>
  <button id="btnFlip" title="Flip (Space)">Flip Card</button>
  <button id="btnNext" title="Next (→)">Next →</button>
  <button id="btnShuffle" title="Shuffle deck">Shuffle</button>
  <button id="btnRestart" title="Back to start">Restart</button>
  <span style="flex:1"></span>
  <div class="chips" id="chips"></div>
</div>
<div class="progress-wrap"><div id="progressbar"></div></div>
<main>
  <div id="cardwrap" title="Click to flip">
    <div id="card">
      <div class="face front">
        <div class="badge-row"><span class="cat" id="fcat"></span><span class="n" id="fn"></span></div>
        <div class="label">Question</div>
        <div class="qtext" id="fq"></div>
        <div class="hint">Click card or press Space to flip · ← → to navigate</div>
      </div>
      <div class="face back">
        <div class="badge-row"><span class="cat" id="bcat"></span><span class="n" id="bn"></span></div>
        <div class="label">Answer</div>
        <div class="atext" id="ba"></div>
      </div>
    </div>
  </div>
</main>
<footer>
  <span><b id="cur">1</b> / <b id="tot">17</b></span>
  <span>Source-faithful flashcards · Internal Medicine · Structural &amp; Vascular Renal Diseases</span>
  <span>Keys: <span class="kbd">←</span> <span class="kbd">→</span> prev/next · <span class="kbd">Space</span> flip · <span class="kbd">S</span> shuffle</span>
</footer>
<script>
const CARDS = [{"q": "What is the incidence and nature of simple (solitary) renal cysts?", "a": "Common — in <b>50% of persons &gt;50 years</b>; not inherited; do not affect renal function; usually &lt;2 cm, solitary, cortical, often bulging through the renal capsule; may be multiple &amp; bilateral.", "cat": "Cysts"}, {"q": "When are simple renal cysts symptomatic, and what complications can occur?", "a": "Rarely: abdominal mass; <b>hematuria (rare — raises suspicion of renal cell carcinoma)</b>; hypertension from compression of intra-renal vessels. Complications: hemorrhage, infection (fever, pain, pyuria), carcinoma. Renal function stays normal; prognosis excellent.", "cat": "Cysts"}, {"q": "What are the ultrasound criteria of a simple renal cyst?", "a": "<ul><li>Echoes-free (homogeneous)</li><li>Sharply demarcated with a smooth thin wall</li><li><b>Enhanced back wall</b></li></ul>On CT: no enhancement with contrast — <b>a simple cyst does not enhance; renal cell carcinoma does</b>.", "cat": "Cysts"}, {"q": "How are simple renal cysts differentiated from renal abscess and PCKD?", "a": "<b>Abscess:</b> fever, pain, pyuria; thick irregular wall with internal echoes/debris. <b>PCKD:</b> multiple bilateral cysts, family history, systemic involvement, renal failure, hypertension, extra-renal cysts.", "cat": "Cysts"}, {"q": "How is a simple renal cyst managed?", "a": "Asymptomatic → periodic re-evaluation. Large cyst → aspiration + alcohol instillation; if &gt;500 ml of fluid → surgical drainage. Infected cyst → antibiotics (exclude abscess). Hypertension may improve after decompression.", "cat": "Cysts"}, {"q": "Give the genetics of ADPKD.", "a": "Autosomal dominant; defect on <b>chromosome 16 → ADPKD-1</b>, <b>chromosome 4 → ADPKD-2</b>. Common age of presentation: middle age (~40 y). It is a <b>systemic disease</b>.", "cat": "ADPKD"}, {"q": "List the renal clinical features of ADPKD with their mechanisms.", "a": "Hematuria (cyst rupture into pelvis, stone, UTI); renal infection (flank pain, fever — urine may be normal because the cyst doesn't communicate with the urinary tract — <b>use blood cultures</b>); nephrolithiasis (mainly calcium oxalate); abdominal/flank pain (infection, bleeding, rupture, stones); <b>hypertension in ~50%</b> (cyst-induced ischemia → RAAS activation); mild anemia relative to renal failure; palpable irregular kidneys.", "cat": "ADPKD"}, {"q": "List the extra-renal associations of ADPKD.", "a": "Hepatic cysts (50%, usually no functional impairment); pancreatic and splenic cysts; colonic diverticulosis; <b>cerebral berry aneurysms → subarachnoid hemorrhage</b>; mitral valve prolapse, aortic valve abnormalities, aortic aneurysms.", "cat": "ADPKD"}, {"q": "How is ADPKD diagnosed?", "a": "Clinical: middle age, family history (<b>75%</b>), hematuria/mild proteinuria, slow steady decline in renal function. Imaging: US — <b>≥5 cysts scattered in cortex and medulla of each kidney</b>; CT if US unclear; IVP shows stretching/distortion of calyces.", "cat": "ADPKD"}, {"q": "How is renal infection in ADPKD treated?", "a": "Parenteral antibiotics with cyst penetration (<b>ciprofloxacin, trimethoprim-sulfamethoxazole</b>) for 2 weeks followed by long-term oral therapy (months).", "cat": "ADPKD"}, {"q": "What are the key treatment cautions in ADPKD?", "a": "ACEIs/ARBs used with caution in renal impairment (especially with large cysts); diuretics cautiously (hypokalemia may promote cyst development); hematuria usually resolves in 7 days with bed rest + hydration — <b>recurrent bleeding suggests renal cell carcinoma</b>; renal failure: treat as usual but <b>avoid peritoneal dialysis</b>.", "cat": "ADPKD"}, {"q": "Give the genetics and presentation of ARPKD.", "a": "Autosomal recessive, defect on <b>chromosome 6</b>; parents unaffected. Presents perinatally (<b>pulmonary hypoplasia → high mortality</b>), in early life (liver-dominant: hepatic fibrosis, portal hypertension, GI bleeding, hepatosplenomegaly), or later (renal-dominant: abdominal mass, HTN, recurrent UTIs, renal failure in adolescence). May associate with berry/aortic aneurysms and Ehlers-Danlos.", "cat": "ARPKD"}, {"q": "How is ARPKD diagnosed?", "a": "US is the test of choice: <b>enlarged kidneys, smooth, increased echogenicity</b> (normal US does not exclude). Confirmed by absent family history (normal US in parents), liver cysts, and other ARPKD manifestations.", "cat": "ARPKD"}, {"q": "Define hypertensive nephrosclerosis.", "a": "Chronic kidney disease that <b>complicates arterial hypertension</b> — a diagnosis based on <b>clinical criteria, not renal biopsy</b>.", "cat": "HTN-Nephrosclerosis"}, {"q": "List the 5 clinical criteria for diagnosing hypertensive nephrosclerosis.", "a": "<ol><li>History of <b>prolonged hypertension (&gt;10 years)</b></li><li><b>Low-grade proteinuria (&lt;2 gm/day)</b></li><li>Grade I or II hypertensive retinopathy</li><li><b>Small scarred kidneys</b></li><li>No evidence of primary renal disease</li></ol>", "cat": "HTN-Nephrosclerosis"}, {"q": "What is the BP goal in CKD and which diuretic principle applies?", "a": "Intensive BP goal <b>&lt;130/80 mmHg</b>; low-salt diet is critical. <b>Diuretics are the cornerstone</b> — as GFR falls, higher diuretic doses are needed to achieve a natriuretic response.", "cat": "HTN-Nephrosclerosis"}, {"q": "Which antihypertensives are used in proteinuric CKD, and which cautions apply?", "a": "<b>ACEIs/ARBs</b> first-line. <b>Non-dihydropyridine CCBs</b> (verapamil/diltiazem) reduce albuminuria and slow decline. <b>Dihydropyridine CCBs must NOT be monotherapy</b> in proteinuric CKD — always combine with a RAAS blocker. <b>Mineralocorticoid antagonists (spironolactone)</b> are fourth-line for resistant HTN but limited in advanced CKD by <b>hyperkalemia and AKI</b> risk.", "cat": "HTN-Nephrosclerosis"}];
let order = CARDS.map((_, i) => i);
let pos = 0, filter = 'all';

const cats = [...new Set(CARDS.map(c => c.cat))];
const chipsEl = document.getElementById('chips');
function visibleOrder() { return order.filter(i => filter==='all' || CARDS[i].cat===filter); }
function renderChips() {
  chipsEl.innerHTML = '';
  const mk = (label, f) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = filter===f ? 'active' : '';
    b.onclick = () => { filter=f; pos=0; renderChips(); render(); };
    chipsEl.appendChild(b);
  };
  mk('All (' + visibleOrder().length + ')', 'all');
  cats.forEach(c => mk(c + ' (' + CARDS.filter(x => x.cat===c).length + ')', c));
}
function card() {
  const vis = visibleOrder();
  if (!vis.length) return null;
  return CARDS[vis[pos % vis.length]];
}
function render() {
  const vis = visibleOrder();
  document.getElementById('tot').textContent = vis.length;
  const c = card();
  if (!c) {
    document.getElementById('cur').textContent = 0;
    document.getElementById('fq').textContent = 'No cards in this category';
    document.getElementById('ba').innerHTML = 'Choose another category.';
    document.getElementById('fcat').textContent = '';
    document.getElementById('fn').textContent = '';
    document.getElementById('progressbar').style.width = '0%';
    return;
  }
  document.getElementById('cur').textContent = (pos % vis.length) + 1;
  document.getElementById('fcat').textContent = c.cat;
  document.getElementById('bcat').textContent = c.cat;
  document.getElementById('fn').textContent = 'Card ' + (pos % vis.length + 1);
  document.getElementById('bn').textContent = 'Card ' + (pos % vis.length + 1);
  document.getElementById('fq').textContent = c.q;
  document.getElementById('ba').innerHTML = c.a;
  document.getElementById('progressbar').style.width = ((pos % vis.length + 1) / vis.length * 100) + '%';
  document.getElementById('catcount').textContent = filter==='all' ? 'all categories' : 'category: ' + filter;
  flip = false;
  document.getElementById('card').classList.remove('flipped');
}
function flipCard() {
  flip = !flip;
  document.getElementById('card').classList.toggle('flipped', flip);
}
function next() { const n = visibleOrder().length; if (n) { pos++; render(); } }
function prev() { const n = visibleOrder().length; if (n) { pos = (pos + n - 1) % n; render(); } }
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0; render(); renderChips();
}
document.getElementById('btnNext').onclick = next;
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnFlip').onclick = flipCard;
document.getElementById('btnShuffle').onclick = shuffle;
document.getElementById('btnRestart').onclick = () => { order = CARDS.map((_, i) => i); pos = 0; render(); renderChips(); };
document.getElementById('cardwrap').onclick = flipCard;
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === 's' || e.key === 'S') shuffle();
});
renderChips();
render();
</script>
</body>
</html>
