<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urological Trauma — Flashcards</title>
<style>
:root {
  --accent: #4F7A3A; --dark: #2A4220; --mid: #3A5C2C; --bg: #E9F0E4; --card: #F5FAF2; --warn: #8A5A1C; --badge: #CDE0C0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Times New Roman', Georgia, serif; background: var(--bg); color: var(--dark);
  display: flex; flex-direction: column; min-height: 100vh;
}
header {
  background: linear-gradient(135deg, var(--dark), var(--mid) 60%, var(--accent));
  color: #fff; padding: 14px 24px 12px; flex-shrink: 0;
}
header .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 21px; letter-spacing: 1px; }
header .course { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; opacity: .85; }
header .meta { font-size: 13px; opacity: .9; }
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 24px; background: var(--card); border-bottom: 2px solid var(--accent); flex-shrink: 0;
}
.toolbar button, .chips button {
  font-family: inherit; font-size: 13.5px; cursor: pointer; border-radius: 20px; padding: 5px 14px;
  border: 1.5px solid var(--mid); background: #fff; color: var(--dark); transition: all .15s;
}
.toolbar button:hover, .chips button:hover { background: var(--badge); }
.toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button.active { background: var(--dark); color: #fff; border-color: var(--dark); }
.progress-wrap { height: 6px; background: #ddd; }
#progressbar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--warn)); transition: width .25s; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 22px; }
#cardwrap { perspective: 1400px; width: min(760px, 92vw); height: min(430px, 60vh); cursor: pointer; }
#card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s; }
#card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 16px; padding: 26px 34px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.15);
  border: 1px solid var(--mid);
}
.front { background: var(--card); display: flex; flex-direction: column; }
.back { background: #fff; transform: rotateY(180deg); }
.face .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
.face .cat {
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--accent);
  background: var(--badge); padding: 3px 10px; border-radius: 12px;
}
.face .n { font-size: 12px; color: var(--warn); font-weight: 700; }
.front .label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--warn); font-weight: 700; margin-bottom: 6px; }
.front .qtext { font-size: clamp(17px, 2.4vw, 24px); line-height: 1.45; font-weight: 700; }
.back .label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.back .atext { font-size: clamp(14px, 1.9vw, 18.5px); line-height: 1.5; color: #222; }
.back .atext ul { margin: 8px 0 8px 22px; }
.back .atext li { margin: 4px 0; }
.back .atext b { color: var(--dark); }
.back .atext .hl { background: var(--badge); padding: 0 4px; border-radius: 4px; font-weight: 700; color: var(--dark); }
.hint { margin-top: auto; padding-top: 14px; font-size: 12px; color: #888; text-align: center; }
footer { flex-shrink: 0; padding: 10px 24px; font-size: 12.5px; color: var(--mid); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--card); border-top: 1px solid #ddd; }
footer b { color: var(--dark); }
.kbd { border: 1px solid #bbb; border-radius: 4px; padding: 0 5px; background: #fff; font-family: monospace; font-size: 11px; }
@media (max-width: 640px) {
  header h1 { font-size: 16px; } .face { padding: 18px 20px; } .front .qtext { font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <div class="course">Urology · NEPHRO-UROLOGY STUDY</div>
      <h1>Urological Trauma</h1>
    </div>
    <div class="meta"><span id="counts">15 cards</span> · <span id="catcount"></span></div>
  </div>
</header>
<div class="toolbar">
  <button id="btnPrev" title="Previous (←)">← Prev</button>
  <button id="btnFlip" title="Flip (Space)">Flip Card</button>
  <button id="btnNext" title="Next (→)">Next →</button>
  <button id="btnShuffle" title="Shuffle deck">Shuffle</button>
  <button id="btnRestart" title="Back to start">Restart</button>
  <span style="flex:1"></span>
  <div class="chips" id="chips"></div>
</div>
<div class="progress-wrap"><div id="progressbar"></div></div>
<main>
  <div id="cardwrap" title="Click to flip">
    <div id="card">
      <div class="face front">
        <div class="badge-row"><span class="cat" id="fcat"></span><span class="n" id="fn"></span></div>
        <div class="label">Question</div>
        <div class="qtext" id="fq"></div>
        <div class="hint">Click card or press Space to flip · ← → to navigate</div>
      </div>
      <div class="face back">
        <div class="badge-row"><span class="cat" id="bcat"></span><span class="n" id="bn"></span></div>
        <div class="label">Answer</div>
        <div class="atext" id="ba"></div>
      </div>
    </div>
  </div>
</main>
<footer>
  <span><b id="cur">1</b> / <b id="tot">15</b></span>
  <span>Source-faithful flashcards · Urology · Urological Trauma</span>
  <span>Keys: <span class="kbd">←</span> <span class="kbd">→</span> prev/next · <span class="kbd">Space</span> flip · <span class="kbd">S</span> shuffle</span>
</footer>
<script>
const CARDS = [{"q": "What are the initial management principles of urological trauma?", "a": "~10% of ER injuries involve the GU system. Control hemorrhage/shock + resuscitation; IV lines; <b>examine the urethral meatus for blood BEFORE passing a urethral catheter in men</b>; detailed history (type/calibre of weapon in gunshot wounds); examine abdomen/genitalia for contusions or subcutaneous hematomas suggesting deep injury.", "cat": "Overview"}, {"q": "Give the epidemiology and classification (grades) of renal injuries.", "a": "Renal injuries are the most common urinary system injuries; <b>blunt trauma 80–85%</b>; pathological kidneys (hydronephrosis, tumors) rupture more easily. Grades: <b>1 — contusion (most common); 2 — cortical laceration, small perirenal hematoma; 3 — deeper laceration; 4 — ... ; 5 — pedicle avulsion/shattered kidney</b>. The degree of hematuria does NOT correspond to injury severity.", "cat": "Renal"}, {"q": "How are renal injuries staged and when is imaging indicated?", "a": "<b>CT is the gold standard</b> for staging — lacerations, extravasation, hematoma extent, nonviable tissue, associated organ injury. IVP if CT unavailable. Indications: any hematuria after trauma; flank stab/gunshot wounds even without hematuria; rapid deceleration (vascular injury may have NO hematuria). <b>Non-visualization on IVU:</b> pedicle avulsion, arterial thrombosis, severe contusion with vascular spasm, absent kidney.", "cat": "Renal"}, {"q": "What are the complications of renal trauma?", "a": "Early: <b>hemorrhage</b> (most important — heavy retroperitoneal bleeding → collapse). Late: hypertension, hydronephrosis, arteriovenous fistula, calculus formation, pyelonephritis, renal atrophy. Follow-up: monitor BP for months; excretory urography at 3–6 months.", "cat": "Renal"}, {"q": "How are renal injuries treated?", "a": "Minor blunt injuries (85%) — conservative: bed rest, hydration, observe. <b>Surgery</b> for: persistent retroperitoneal bleeding, urinary extravasation, nonviable parenchyma, renal pedicle injuries (&lt;5% of injuries). <b>Penetrating injuries are surgically explored</b> (exception: complete staging shows only minor parenchymal injury).", "cat": "Renal"}, {"q": "When does ureteral injury occur and what is its pathogenesis?", "a": "Rare: difficult pelvic surgery (ligation/cut), endoscopic basket manipulation, gunshot wounds, rapid deceleration (avulsion from pelvis). <b>Partial division — early:</b> urinary extravasation, ileus/peritonitis, urinoma; <b>late:</b> ureterovaginal/ureterocutaneous fistula, fibrosis/stricture, hydronephrosis. <b>Bilateral complete ligation → anuria.</b> Prognosis excellent if diagnosed and corrected early.", "cat": "Ureter"}, {"q": "How are ureteral injuries diagnosed?", "a": "Suspect with retroperitoneal stab/gunshot (mid-ureter most common site); fever, flank pain, ileus, watery discharge from wound/vagina (confirm by creatinine); IV indigo carmine appears blue in urine. Imaging: IVU (delayed excretion + hydronephrosis; extravasation), CTU/3D reconstruction, US (urinoma — best early post-op screen), radionuclide scan.", "cat": "Ureter"}, {"q": "How are ureteral injuries treated?", "a": "Immediate re-exploration when recognized during surgery; delayed repair within 7–10 days if no infection/abscess; <b>percutaneous nephrostomy</b> if recognized late or complicated. Goals: complete debridement, tension-free spatulated anastomosis, watertight closure, ureteral stenting, drainage.", "cat": "Ureter"}, {"q": "Describe the pathogenesis and clinical findings of bladder rupture.", "a": "~15% of pelvic fractures have bladder/urethral injury; <b>pelvic fracture accompanies bladder rupture in 90%</b>. Fracture fragments perforate → <b>extraperitoneal rupture</b>; direct blow to a full bladder → <b>intraperitoneal rupture</b>. Clinical: inability to void, gross hematuria, pelvic/lower abdominal pain, hemorrhagic shock (pelvic venous disruption), acute abdomen with intraperitoneal rupture, indistinct rectal landmarks from pelvic hematoma.", "cat": "Bladder"}, {"q": "Describe the ascending cystogram technique and findings.", "a": "Fill bladder with 300 mL contrast → drain completely → take a second film. Demonstrates extraperitoneal extravasation (may not appear on filling film) and <b>intraperitoneal extravasation (free contrast in the abdomen)</b>. Complications: pelvic abscess (extraperitoneal rupture + infected hematoma), delayed peritonitis (intraperitoneal), partial incontinence (bladder neck injury).", "cat": "Bladder"}, {"q": "How is bladder rupture treated?", "a": "<b>Extraperitoneal:</b> urethral catheter drainage alone usually suffices (~10 days). <b>Intraperitoneal:</b> surgical repair via transperitoneal approach — close perforations, close peritoneum carefully, close bladder in layers with absorbable suture, evacuate all extravasated fluid; suprapubic cystostomy left in place; avoid entering the lateral pelvic hematoma. Prognosis excellent; catheter removed ~10 days.", "cat": "Bladder"}, {"q": "What are the anatomic divisions of the urethra and how do they relate to injury?", "a": "<b>Posterior urethra</b> = prostatic + membranous portions — injured by <b>pelvic fractures</b> (membranous urethra sheared from the prostatic apex). <b>Anterior urethra</b> = bulbous + pendulous portions — injured by <b>straddle falls</b>. <b>Blood at the urethral meatus is the single most important sign of urethral injury</b>.", "cat": "Urethra"}, {"q": "What are the dangers of passing a catheter in posterior urethral injury?", "a": "May infect the periprostatic/perivesical hematoma and convert an incomplete laceration into a complete one. Management: treat shock/hemorrhage; <b>avoid urethral catheterization</b>; <b>suprapubic cystostomy</b> for 3 months; incomplete laceration heals spontaneously (catheter removed 2–3 weeks after no extravasation on VCUG); delayed reconstruction after 3 months.", "cat": "Urethra"}, {"q": "Compare primary repair vs delayed reconstruction for posterior urethral injury.", "a": "<b>Stricture:</b> ~50% (primary) vs ~5% (delayed). <b>Impotence:</b> 30–80% mean ~50% vs 30–35%. <b>Incontinence:</b> one-third vs &lt;5%. <b>Delayed reconstruction after suprapubic drainage dramatically reduces all three complications.</b>", "cat": "Urethra"}, {"q": "Describe anterior urethral injury — pathogenesis and complications.", "a": "Straddle injury or instrumentation; contusion (perineal hematoma, resolves) vs laceration (urine extravasation limited by <b>Colles' fascia</b> — extends into scrotum, penile shaft, abdominal wall → sepsis). Complications: bleeding (corpus spongiosum; local pressure), infection/sepsis (debridement + drainage), <b>stricture</b> (common; often mild). Management: suprapubic cystostomy; voiding study at 7 days (minor) or 2–3 weeks (extensive); extensive extravasation → immediate repair.", "cat": "Urethra"}];
let order = CARDS.map((_, i) => i);
let pos = 0, filter = 'all';

const cats = [...new Set(CARDS.map(c => c.cat))];
const chipsEl = document.getElementById('chips');
function visibleOrder() { return order.filter(i => filter==='all' || CARDS[i].cat===filter); }
function renderChips() {
  chipsEl.innerHTML = '';
  const mk = (label, f) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = filter===f ? 'active' : '';
    b.onclick = () => { filter=f; pos=0; renderChips(); render(); };
    chipsEl.appendChild(b);
  };
  mk('All (' + visibleOrder().length + ')', 'all');
  cats.forEach(c => mk(c + ' (' + CARDS.filter(x => x.cat===c).length + ')', c));
}
function card() {
  const vis = visibleOrder();
  if (!vis.length) return null;
  return CARDS[vis[pos % vis.length]];
}
function render() {
  const vis = visibleOrder();
  document.getElementById('tot').textContent = vis.length;
  const c = card();
  if (!c) {
    document.getElementById('cur').textContent = 0;
    document.getElementById('fq').textContent = 'No cards in this category';
    document.getElementById('ba').innerHTML = 'Choose another category.';
    document.getElementById('fcat').textContent = '';
    document.getElementById('fn').textContent = '';
    document.getElementById('progressbar').style.width = '0%';
    return;
  }
  document.getElementById('cur').textContent = (pos % vis.length) + 1;
  document.getElementById('fcat').textContent = c.cat;
  document.getElementById('bcat').textContent = c.cat;
  document.getElementById('fn').textContent = 'Card ' + (pos % vis.length + 1);
  document.getElementById('bn').textContent = 'Card ' + (pos % vis.length + 1);
  document.getElementById('fq').textContent = c.q;
  document.getElementById('ba').innerHTML = c.a;
  document.getElementById('progressbar').style.width = ((pos % vis.length + 1) / vis.length * 100) + '%';
  document.getElementById('catcount').textContent = filter==='all' ? 'all categories' : 'category: ' + filter;
  flip = false;
  document.getElementById('card').classList.remove('flipped');
}
function flipCard() {
  flip = !flip;
  document.getElementById('card').classList.toggle('flipped', flip);
}
function next() { const n = visibleOrder().length; if (n) { pos++; render(); } }
function prev() { const n = visibleOrder().length; if (n) { pos = (pos + n - 1) % n; render(); } }
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0; render(); renderChips();
}
document.getElementById('btnNext').onclick = next;
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnFlip').onclick = flipCard;
document.getElementById('btnShuffle').onclick = shuffle;
document.getElementById('btnRestart').onclick = () => { order = CARDS.map((_, i) => i); pos = 0; render(); renderChips(); };
document.getElementById('cardwrap').onclick = flipCard;
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === 's' || e.key === 'S') shuffle();
});
renderChips();
render();
</script>
</body>
</html>
